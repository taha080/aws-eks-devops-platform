{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "linkforge.fullname" . }}
  labels:
    {{- include "linkforge.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "linkforge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: http
  # Egress stays open so pods can reach DNS, RDS, and the STS endpoint used by IRSA.
  # Tighten this once the database CIDR and STS endpoint are known for the account.
  egress:
    - {}
{{- end }}
