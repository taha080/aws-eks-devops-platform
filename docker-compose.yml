services:
  api:
    build:
      context: ./app
    image: linkforge:local
    ports:
      - "8000:8000"
    environment:
      LINKFORGE_ENVIRONMENT: local
      LINKFORGE_LOG_LEVEL: INFO
      LINKFORGE_BASE_URL: http://localhost:8000
      LINKFORGE_DATABASE_URL: sqlite:////data/linkforge.db
      LINKFORGE_HOST: 0.0.0.0
      LINKFORGE_PORT: "8000"
    volumes:
      - linkforge-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Optional shared database. The password below is for this local compose file only.
  #   docker compose --profile postgres up
  #   and set LINKFORGE_DATABASE_URL on the api service to
  #   postgresql+psycopg://linkforge:linkforge@postgres:5432/linkforge
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: linkforge
      POSTGRES_PASSWORD: linkforge
      POSTGRES_DB: linkforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkforge -d linkforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["metrics"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  linkforge-data:
  pgdata:
