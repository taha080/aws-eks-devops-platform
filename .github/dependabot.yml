version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/bootstrap
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/envs/dev
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/envs/prod
    schedule:
      interval: weekly
